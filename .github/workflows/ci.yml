name: VoiceQL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/test_voiceql.py -v
        env:
          OPENAI_API_KEY: sk-test-fake
          ANTHROPIC_API_KEY: sk-ant-test-fake
          GOOGLE_TTS_CREDENTIALS: credentials/fake.json
          DATABASE_URL: ":memory:"
